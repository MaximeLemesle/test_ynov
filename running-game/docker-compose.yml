services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: run
      POSTGRES_PASSWORD: run
      POSTGRES_DB: run_game
    ports:
      - "5432:5432"
    volumes:
      - run_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U run -d run_game"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  run_postgres:
